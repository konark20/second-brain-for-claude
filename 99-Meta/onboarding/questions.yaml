# Onboarding question bank, version 2.0.0
# Read by the onboard skill (99-Meta/skills/vault/onboard.md). Machine-readable on purpose:
# add a module or a role pack here and every new owner gets it, no skill edits needed.
#
# Field guide
#   id           stable id, used in progress.yaml and for "redo <id>"
#   ask          the question, in plain words. Claude may rephrase to fit the conversation
#   why          one line Claude can say if the owner asks "why do you need this?"
#   suggestions  answer chips. Shown as options (max 4 in a picker, numbered in plain chat).
#                The owner can always answer in their own words instead
#   multi        true if several suggestions can be picked
#   writes_to    file#section the answer lands in (shown to the owner before writing)
#   optional     true means skip silently in quick mode
#   follow_up    one probing question Claude asks only if the answer is short or vague
#   exercise     a calibration exercise instead of a plain question (see onboard.md)

version: 2.1.0

privacy:
  never_ask: [health or medical details, religion, politics, sexuality, ethnicity or caste,
              immigration or visa status, personal finances or salary, government ID or account numbers,
              passwords or keys, family matters beyond what affects the work schedule]
  if_volunteered: do not write it anywhere; say once that it will not be stored, then move on
  labels: never infer a personality type or psychological label. Record only what the owner says about themselves

modes:
  quick:
    minutes: 15
    sittings: 1
    modules: [welcome, identity, communication, rules, projects, first_win, portrait]
  standard:
    minutes: 45
    sittings: 1-2
    modules: [welcome, identity, role_week, communication, feedback, domains, rules, projects, recurring, tools, rhythm, first_win, portrait]
  deep:
    minutes: 90-150
    sittings: 3-5
    modules: [welcome, identity, role_week, communication, domains, rules, projects, recurring, tools, rhythm,
              thinking, work_style, feedback, voice, people, goals, growth, likes, role_pack, first_win, portrait]

modules:

  - id: welcome
    title: Getting started
    writes_to: 99-Meta/onboarding/progress.yaml
    questions:
      - id: welcome.mode
        ask: How much time do you want to give this today? You can stop at any point and pick up later, nothing is lost.
        why: Decides how many modules we cover now.
        suggestions: ["Quick, about 15 minutes", "Standard, about 45 minutes", "Deep, over a few sittings (best results)", "Just ask me a few and see"]
      - id: welcome.style
        ask: How do you like to answer?
        why: Some people prefer picking options, some prefer talking.
        suggestions: ["Give me options to pick from", "Let me type freely", "Mix of both", "I'll paste or dictate long answers"]
      - id: welcome.language
        ask: Which language should we do this in?
        suggestions: ["English", "Hindi", "Hinglish", "Another language"]

  - id: identity
    title: Who you are
    writes_to: 99-Meta/USER_PROFILE.md#who
    questions:
      - id: identity.name
        ask: What should I call you?
        suggestions: ["First name", "Full name", "A nickname", "A title, e.g. Sir or Ma'am"]
      - id: identity.role
        ask: What do you do, in the words you'd use on a business card?
        why: Sets the level and vocabulary of everything I write for you.
        follow_up: And what does that actually mean day to day?
      - id: identity.org
        ask: Where do you do it, and roughly how big is the team or organisation?
        suggestions: ["On my own", "Small team, under 20", "Mid-size, 20 to 500", "Large organisation"]
      - id: identity.location
        ask: Where are you based, and which time zone should I use?
        why: Dates, deadlines and when to schedule check-ins.
      - id: identity.one_line
        ask: If a colleague introduced you in one sentence, what would they say?
        optional: true

  - id: role_week
    title: Your role and your week
    writes_to: 99-Meta/USER_PROFILE.md#who
    questions:
      - id: role_week.normal_week
        ask: Walk me through a normal week. What happens on which days?
        follow_up: Which part of the week matters most for the results you're judged on?
      - id: role_week.own_vs_oversee
        ask: What do you do yourself, and what do you oversee through others?
        why: Decides whether I draft for you to send, or summarise for you to review.
      - id: role_week.reporting
        ask: Who do you answer to, and who answers to you? Roles are enough, no names needed.
      - id: role_week.time_sinks
        ask: Where does your time go that you wish it didn't?
        suggestions: ["Email", "Meetings", "Reports and documents", "Chasing people", "Searching for information"]
        multi: true

  - id: communication
    title: How you want me to talk to you
    writes_to: 99-Meta/USER_PROFILE.md#communication
    questions:
      - id: communication.length
        ask: When I answer, how long should it be?
        suggestions: ["As short as possible", "Short, with detail if I ask", "Medium, with reasoning", "Depends on the topic"]
      - id: communication.order
        ask: Answer first and reasoning after, or the other way round?
        suggestions: ["Answer first", "Reasoning first", "Just the answer"]
      - id: communication.format
        ask: How do you like information laid out?
        suggestions: ["Bullet points", "Short paragraphs", "Tables where possible", "Whatever fits"]
      - id: communication.report
        ask: After I finish a piece of work, how should I report back?
        suggestions: ["A short status block: done, needs me, next", "A short paragraph", "Only tell me what needs me", "Full detail"]
      - id: communication.dislikes
        ask: Anything in AI writing that annoys you?
        suggestions: ["Long preambles", "Em dashes", "Emoji", "Buzzwords like 'leverage' or 'delve'"]
        multi: true
      - id: communication.spelling
        ask: Which spelling and register?
        suggestions: ["Indian English", "British English", "American English", "Formal", "Conversational"]
        multi: true
      - id: communication.unsure
        ask: When I'm unsure about something, what should I do?
        suggestions: ["Ask me", "Make your best call and flag it", "Ask only for important things", "Give me options"]
      - id: communication.tone_test
        exercise: tone_ab
        ask: I'll write the same short update two ways. Which one sounds right to you?

  - id: domains
    title: What you work on
    writes_to: 99-Meta/USER_PROFILE.md#domains
    questions:
      - id: domains.list
        ask: Which areas do you work in? For each one, are you the expert, the decision-maker, or the reviewer?
        follow_up: Which one takes the most of your time?
      - id: domains.help
        ask: Where would help save you the most time?
        suggestions: ["Thinking things through", "First drafts", "Research", "Tracking and follow-ups", "Reviewing others' work"]
        multi: true
      - id: domains.depth
        ask: In your main area, how much should I explain versus assume you know?
        suggestions: ["Assume expert, skip basics", "Brief refreshers are fine", "Explain fully, I'm still learning it"]
      - id: domains.references
        ask: What reference material do you keep going back to, and where does it live?
        why: So research starts from your sources, not generic ones.

  - id: rules
    title: Your hard rules
    writes_to: 99-Meta/BOUNDARIES.md#owner-specific
    approval: explicit   # BOUNDARIES is owner-edited only; show the diff and wait for a clear yes
    questions:
      - id: rules.never
        ask: What must I never do, no matter who asks?
        suggestions: ["Never send anything without me", "Never name clients", "Never quote prices or fees", "Never commit me to a date"]
        multi: true
      - id: rules.confidential
        ask: Is any information confidential by contract or by profession?
        suggestions: ["Client details", "Financial figures", "HR or people matters", "Internal strategy", "Nothing special"]
        multi: true
      - id: rules.codes
        ask: Should client or customer names be replaced with codes in notes?
        suggestions: ["Yes, always use codes", "Names are fine", "Only for some clients"]
      - id: rules.services
        ask: Which places am I allowed to use for work material?
        suggestions: ["This vault only", "Company drive or email too", "Anything I connect", "Ask me each time"]
      - id: rules.professional_codes
        ask: Are there professional or regulatory codes your drafts must respect?
        optional: true

  - id: projects
    title: Current projects
    writes_to: 01-Projects/<slug>/_hub.md
    repeat: up to 5
    questions:
      - id: projects.name
        ask: What's one thing you're working on right now that has an end point?
      - id: projects.done
        ask: What does "done" look like for it?
      - id: projects.deadline
        ask: Is there a real deadline?
        suggestions: ["Yes, a fixed date", "A rough target", "No deadline"]
      - id: projects.people
        ask: Who else is involved, by role?
      - id: projects.next
        ask: What's the very next step?
      - id: projects.more
        ask: Another project?
        suggestions: ["Yes", "That's enough for now"]

  - id: recurring
    title: What repeats
    writes_to: 05-Journal/<today>.md and 99-Meta/PATTERN_LOG.md (shape seed)
    questions:
      - id: recurring.weekly
        ask: What do you do every week that follows roughly the same steps?
        suggestions: ["Meeting prep or notes", "Status reports", "Answering the same kinds of questions", "Reviewing documents", "Writing posts or articles"]
        multi: true
        follow_up: Walk me through the steps the last time you did it.
      - id: recurring.delegated
        ask: What do you hand to others that comes back wrong in the same way?
        optional: true
      - id: recurring.morning
        ask: What do you check first thing each morning?

  - id: tools
    title: Your tools
    writes_to: 99-Meta/USER_PROFILE.md#ai
    questions:
      - id: tools.devices
        ask: Which devices do you work on?
        suggestions: ["Laptop", "Desktop", "Tablet", "Phone"]
        multi: true
      - id: tools.apps
        ask: Which apps run your day?
        suggestions: ["Outlook or Gmail", "Teams or Slack", "Excel, Word, PowerPoint", "WhatsApp", "A practice or CRM tool"]
        multi: true
      - id: tools.claude
        ask: Where will you talk to me most?
        suggestions: ["Claude desktop app", "Browser", "Phone app", "Claude Code in a terminal"]
        multi: true
      - id: tools.other_ai
        ask: Do you use other AI tools? For what?
        optional: true
      - id: tools.backup
        ask: Where should this vault be backed up?
        suggestions: ["Private GitHub repo", "Company-approved drive", "This computer only", "Not sure, advise me"]

  - id: rhythm
    title: How I should check in
    writes_to: 99-Meta/USER_PROFILE.md#preferences
    questions:
      - id: rhythm.daily
        ask: Do you want a daily journal started for you?
        suggestions: ["Yes, mornings", "Yes, evenings", "No"]
      - id: rhythm.weekly
        ask: When should we do a weekly review?
        suggestions: ["Friday afternoon", "Sunday evening", "Monday morning", "Skip it"]
      - id: rhythm.skills
        ask: When I notice you doing something repeatedly, should I offer to make a skill for it?
        suggestions: ["Yes, offer right away", "Batch them weekly", "Only when I ask"]
      - id: rhythm.calibrate
        ask: Can I ask you two or three short tuning questions each week, to keep learning how you work?
        suggestions: ["Yes", "Once a month", "No"]

  # ---------------- deep mode modules ----------------

  - id: thinking
    title: How you think and decide
    writes_to: 99-Meta/USER_PROFILE.md#thinking
    questions:
      - id: thinking.decisions
        ask: When you face a decision, what do you want from me?
        suggestions: ["A recommendation", "Options with trade-offs", "The strongest case against my first instinct", "Just the facts"]
        multi: true
      - id: thinking.evidence
        ask: What convinces you?
        suggestions: ["Numbers", "Examples and stories", "Precedent, what others did", "First-principles logic"]
        multi: true
      - id: thinking.risk
        ask: How cautious should I be when I suggest things?
        suggestions: ["Conservative", "Balanced", "Bold, I'll pull back if needed"]
      - id: thinking.planning
        ask: Do you prefer to plan in detail first, or start and adjust?
        suggestions: ["Plan first", "Rough plan, then adjust", "Start and adjust"]
      - id: thinking.example
        ask: Tell me about a recent decision you're happy with. What made it good?
        optional: true

  - id: work_style
    title: Your working style
    writes_to: 99-Meta/USER_PROFILE.md#work-style
    questions:
      - id: work_style.focus
        ask: When do you do your best focused work?
        suggestions: ["Early morning", "Late morning", "Afternoon", "Night"]
      - id: work_style.interruptions
        ask: How should I handle things that come up while you're focused?
        suggestions: ["Capture them, show me later", "Tell me only if urgent", "Tell me right away"]
      - id: work_style.chunks
        ask: How big should a piece of work be before I check in with you?
        suggestions: ["Small steps, check often", "Medium chunks", "Do the whole thing, then show me"]
      - id: work_style.deadlines
        ask: How do you work with deadlines?
        suggestions: ["Early, well ahead", "Steady pace", "Close to the deadline", "Remind me well in advance"]

  - id: feedback
    title: Feedback and disagreement
    writes_to: 99-Meta/USER_PROFILE.md#communication
    questions:
      - id: feedback.pushback
        ask: If I think you're making a mistake, how should I say it?
        suggestions: ["Bluntly", "Directly but politely", "Ask a question that makes me see it", "Only if it really matters"]
      - id: feedback.scope
        ask: When you give me a narrow instruction (for example, bold this one point), how far should I apply it?
        why: Applying a narrow instruction everywhere is the most common way an assistant oversteps.
        suggestions: ["Exactly where I said", "Do that, then ask before widening", "Apply wherever it clearly fits, tell me after"]
      - id: feedback.review
        ask: When I review your work, what do you want?
        suggestions: ["Only the top three fixes", "Everything I find", "Mark it up as a diff", "Rewrite it, then show me"]
      - id: feedback.correct_me
        ask: When I get something wrong about you, how should I learn from it?
        suggestions: ["Update the profile and tell me", "Update silently", "Ask before changing anything"]

  - id: voice
    title: Your writing voice
    writes_to: 02-Areas/writing/voice.md
    questions:
      - id: voice.samples
        ask: "Paste two or three things you wrote that you're happy with: emails, posts, a report section."
        why: This is the fastest way for me to sound like you.
      - id: voice.audiences
        ask: Who do you write for most?
        suggestions: ["Clients", "Senior leadership", "My team", "The public, posts and articles"]
        multi: true
      - id: voice.ab
        exercise: voice_ab
        ask: Here are two versions of the same paragraph. Which one is closer to you, and what would you change?
      - id: voice.signoff
        ask: How do you usually open and close emails?
        optional: true

  - id: people
    title: The people around your work
    writes_to: 99-Meta/USER_PROFILE.md#people (roles only)
    questions:
      - id: people.stakeholders
        ask: Which roles do you write to or deal with most? For each, how formal should I be?
        suggestions: ["Very formal", "Professional", "Warm and informal"]
        follow_up: Anyone who needs extra care in how things are worded?
      - id: people.names
        ask: Do you want me to know names for people I'll draft messages to?
        suggestions: ["Yes, add them as I go", "Roles only", "Ask each time"]

  - id: goals
    title: What you're aiming for
    writes_to: 99-Meta/USER_PROFILE.md#goals
    questions:
      - id: goals.quarter
        ask: What would make the next three months a success?
      - id: goals.year
        ask: And this year?
        optional: true
      - id: goals.stop
        ask: Is there anything you want to stop doing, or do less of?
        optional: true

  - id: growth
    title: Learning and growth
    writes_to: 99-Meta/USER_PROFILE.md#growth
    questions:
      - id: growth.learn
        ask: What do you want to get better at this year?
      - id: growth.how
        ask: How do you learn best?
        suggestions: ["Examples first", "Explanations first", "Quiz me", "Learn by doing"]
        multi: true

  - id: likes
    title: Small things that matter
    writes_to: 99-Meta/USER_PROFILE.md#preferences
    questions:
      - id: likes.peeves
        ask: What small things irritate you in how work is done or written?
        optional: true
      - id: likes.delights
        ask: What does a colleague do that makes your day easier?
        optional: true

  - id: role_pack
    title: Questions for your kind of work
    writes_to: 99-Meta/USER_PROFILE.md#domains
    pick_by: identity.role   # Claude picks the closest pack, or asks which fits
    packs:
      manager_partner:
        - How many people report to you directly, and how do you track what they're doing?
        - Which meetings do you prepare for, and what does good preparation look like?
        - What decisions come to you every week?
        - "How do you want delegated work tracked: a list, reminders, or a weekly summary?"
      consultant:
        - How does a typical engagement start and end?
        - "Which deliverables do you produce most: proposals, decks, memos, models?"
        - How do you research a new client before the first meeting?
        - What does a great deliverable from your firm look like?
      tax_legal_compliance:
        - Which regimes, laws or areas do you cover?
        - Where do new circulars, rulings or notifications come from, and how do you track them?
        - What do clients ask you most often?
        - Which parts always need your professional judgment, never a draft's?
      writer_creator:
        - What do you publish, where, and how often?
        - Where do your ideas come from, and where do you keep them?
        - What does your editing process look like?
      student_researcher:
        - What are you studying or researching, and what's the next deadline?
        - How do you take notes from papers and lectures?
        - What would you like to be quizzed on?
      developer:
        - Which languages, frameworks and repositories do you work in?
        - "How do you want code changes shown: diffs, full files, or explanations?"
        - Should I run tests, or give you the command to run them?
      job_seeker:
        - Which roles, sectors and locations are you targeting?
        - Do you have a master resume, and in what format?
        - How many applications a week are you aiming for?
      trader:
        - Which instruments and timeframes do you trade?
        - What are your risk rules per trade and per day?
        - Do you keep a trading journal now?
      small_business:
        - What does the business do, and who are the customers?
        - "Which tasks eat your week: sales, suppliers, accounts, hiring?"
        - Which numbers do you check every week?

  - id: first_win
    title: Your first win
    writes_to: 05-Journal/<today>.md
    questions:
      - id: first_win.task
        ask: What's one task this week where, if I did it well, you'd keep using this?
        suggestions: ["Draft something I've been putting off", "Organise my notes or inbox", "Research a question", "Plan a project"]
      - id: first_win.now
        ask: Shall we do it right now?
        suggestions: ["Yes, let's do it", "Later today", "Tomorrow"]

  - id: portrait
    title: Here's who I think you are
    writes_to: 99-Meta/USER_PROFILE.md (all sections, with approval)
    questions:
      - id: portrait.review
        exercise: portrait
        ask: Here's a one-page portrait of how you work, written from your answers. What's wrong, missing or overstated?
